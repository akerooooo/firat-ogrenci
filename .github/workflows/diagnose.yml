name: Kaynak erişimini incele
on: workflow_dispatch
permissions:
  contents: read
jobs:
  connection:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node diagnose-network.mjs
