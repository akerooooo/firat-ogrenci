name: Tanı
on: workflow_dispatch
jobs:
  tani:
    runs-on: ubuntu-latest
    steps:
      - run: curl -s https://ipinfo.io/json || true
      - run: curl -sv -m 20 -o /dev/null https://www.firat.edu.tr/tr 2>&1 | tail -15 || true
      - run: curl -sv -4 -m 20 -o /dev/null https://unievi.firat.edu.tr/tr 2>&1 | tail -15 || true
      - run: getent ahosts www.firat.edu.tr || true
