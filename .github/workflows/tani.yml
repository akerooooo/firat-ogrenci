name: Tanı
on: workflow_dispatch
jobs:
  tani:
    runs-on: ubuntu-latest
    steps:
      - run: |
          P=https://firat-proxy.sable-idea.workers.dev
          for u in https://unievi.firat.edu.tr/tr https://www.firat.edu.tr/tr/page/announcement https://sksdab.firat.edu.tr/announcements-all https://muhendislikf.firat.edu.tr/announcements-all; do
            curl -s -m 40 -o out.html -w "%{http_code} %{size_download} %{time_total}s $u\n" "$P/?u=$u" || echo "FAIL $u"
          done
          curl -s -m 20 -o /dev/null -w "%{http_code} evil\n" "$P/?u=https://example.com"
